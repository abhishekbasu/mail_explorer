[project]
name = "mail-explorer"
version = "0.1.0"
description = "A memory-bounded, local web viewer for large mbox archives"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
]

[dependency-groups]
dev = ["httpx>=0.27,<1.0", "pytest>=8,<10", "ruff>=0.9,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[project.scripts]
mail-explorer = "mail_explorer:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
